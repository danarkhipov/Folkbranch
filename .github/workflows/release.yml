name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/danarkhipov/folkbranch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  # What the install command downloads when it does not use Docker. Each is built and tried on its own platform.
  bundles:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/make-bundle.mjs
      - name: The archive installs and answers
        if: runner.os != 'Windows'
        run: |
          FOLKBRANCH_BUNDLE="file://$(ls "$PWD"/dist/folkbranch-*.tar.gz)" sh install.sh --local --dir "$RUNNER_TEMP/folkbranch" --port 3000
          curl -fs http://127.0.0.1:3000/api/health
          "$RUNNER_TEMP/folkbranch/folkbranch" stop
      - name: The Windows archive installs and answers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FOLKBRANCH_BUNDLE = (Get-ChildItem dist\\folkbranch-*.zip | Select-Object -First 1).FullName
          $env:FOLKBRANCH_DIR = Join-Path $env:RUNNER_TEMP 'folkbranch'
          .\\install.ps1
          Invoke-WebRequest http://127.0.0.1:3000/api/health -UseBasicParsing
          & (Join-Path $env:FOLKBRANCH_DIR 'folkbranch.cmd') stop
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/folkbranch-* --clobber
