name: Pull request title

# Pull requests are squash-merged and the title becomes the commit message, so it follows Conventional Commits
# (feat:, fix:, docs:, test:, chore:, perf:), as docs/RELEASING.md says. Checked again when the title is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            test
            chore
            refactor
            build
            ci
            revert
