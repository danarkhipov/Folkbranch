name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  local-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/make-bundle.mjs
      - name: Installs without Docker and answers
        run: |
          FOLKBRANCH_BUNDLE="file://$(ls "$PWD"/dist/folkbranch-*.tar.gz)" sh install.sh --local --dir "$RUNNER_TEMP/folkbranch" --port 3000
          curl -fs http://127.0.0.1:3000/api/health
          "$RUNNER_TEMP/folkbranch/folkbranch" stop

  server-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/make-bundle.mjs
      - name: Installs with --server on the Linux people rent, and survives a reboot
        run: node tests/e2e/server-install.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The image builds and answers
        run: |
          docker build -t folkbranch .
          docker run -d --name folkbranch -p 3000:3000 folkbranch
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && docker exec folkbranch node folkbranch.mjs doctor && exit 0; sleep 2; done
          docker logs folkbranch
          exit 1
