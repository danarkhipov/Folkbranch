name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No commit names an AI assistant as author or co-author
        run: sh scripts/authorship.sh range HEAD

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types and ESLint (old findings are listed in eslint-suppressions.json; new ones fail)
        run: pnpm lint
      - run: pnpm test
      - name: No dependency with a known high or critical vulnerability
        run: pnpm audit --audit-level high
      - name: No circular imports
        run: pnpm exec madge --circular --extensions ts,tsx --ts-config tsconfig.json app components lib

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: A pull request adds no vulnerable dependency and no licence that conflicts with the AGPL
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          deny-licenses: SSPL-1.0, BUSL-1.1

  local-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/make-bundle.mjs
      - name: Installs without Docker and answers
        run: |
          FOLKBRANCH_BUNDLE="file://$(ls "$PWD"/dist/folkbranch-*.tar.gz)" sh install.sh --local --dir "$RUNNER_TEMP/folkbranch" --port 3000
          curl -fs http://127.0.0.1:3000/api/health
          "$RUNNER_TEMP/folkbranch/folkbranch" stop
      - name: Data entered in the last release survives the update, a restart and a crash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/e2e/data-survives.mjs
      - name: The install command updates the last release to this one while a page is open, and nothing is lost
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/e2e/upgrade-install.mjs
      - name: The update button installs another build over this one, with a checked copy first and nothing entered lost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo danarkhipov/folkbranch --pattern "folkbranch-linux-x64.tar.xz" --dir "$RUNNER_TEMP/next"
          FG_NEXT_BUNDLE="$RUNNER_TEMP/next/folkbranch-linux-x64.tar.xz" node tests/e2e/self-update.mjs
      - name: Many people writing at once, deletes against edits, and a restart lose nothing
        run: node tests/e2e/concurrent-people.mjs
      - name: Live updates reach other pages, and confirmed writes survive the server being killed mid-write
        run: node tests/e2e/concurrent-live.mjs
      - name: A person, the assistant and an outside agent over MCP change the same archive, and nothing is lost or overwritten
        run: node tests/e2e/concurrent-agents.mjs

  server-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/make-bundle.mjs
      - name: Installs with --server on the Linux people rent, and survives a reboot
        run: node tests/e2e/server-install.mjs

  ui:
    # The app as a person sees it, on an invented family: the screens at phone, tablet and laptop sizes, the map and its
    # layers in four languages, the map scenario. The screenshots are kept, so a reviewer can look without running it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Browser checks (layout, map layers, map scenario)
        run: node scripts/ui-check.mjs --no-build
      - name: Keep the screenshots of every state it looked at
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ui-screenshots
          path: ui-shots
          retention-days: 14
          if-no-files-found: ignore

  workflows:
    # A mistake in a workflow shows only when it runs; this reads them first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The workflow files are valid, and no step takes a pull request's text as a command
        uses: docker://rhysd/actionlint:1.7.7

  secrets:
    # Keys, tokens and private data must not be committed, in any commit of the branch.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No secret in the history of this branch
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No archive, photo or backup of real people is committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)(data/|.*\.(db|sqlite|sqlite3|ged|gramps)$)' | grep -vE '^(tests/|docs/|public/|drizzle/)' || true)
          if [ -n "$bad" ]; then echo "Data files that look like an archive:"; echo "$bad"; exit 1; fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The image builds and answers
        run: |
          docker build -t folkbranch .
          docker run -d --name folkbranch -p 3000:3000 folkbranch
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && docker exec folkbranch node folkbranch.mjs doctor && exit 0; sleep 2; done
          docker logs folkbranch
          exit 1
      - name: The image has no critical vulnerability with a fix available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: folkbranch
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
