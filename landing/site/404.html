*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root{color-scheme:only light;--paper:#f6f1e7;--card:#fffcf6;--ink:#2b2118;--soft:#5d5042;--line:#dfd4c0;--accent:#9a4727;--accent-d:#823a1e;--well:#2b2118;--wellink:#f6f1e7;--maxw:1160px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif}
img{max-width:100%;height:auto;display:block}
a{color:var(--accent-d);text-underline-offset:3px}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1,h2,h3{font-family:'Literata',Georgia,serif;font-weight:600;color:var(--ink);margin:0;overflow-wrap:break-word;hyphens:manual}
h1{font-size:32px;line-height:1.14;letter-spacing:-.01em}
h2{font-size:32px;line-height:1.15}
h3{font-size:20px;line-height:1.3}
p{margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--paper);padding:0 16px;min-height:44px;line-height:44px;border-radius:8px;z-index:10}
.skip:focus{left:12px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:var(--maxw);margin:0 auto;padding:6px 8px 6px 20px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;font:600 22px 'Literata',Georgia,serif;color:var(--ink);text-decoration:none}
.brand img{width:32px;height:32px}
.nav{display:none}
.nav a,.langlink,.ghlink{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:var(--ink);text-decoration:none;font-weight:500;border-radius:8px}
.nav a:hover,.langlink:hover,.ghlink:hover{background:#ece4d3;color:var(--ink)}
.topright{display:flex;align-items:center;gap:2px}
.ghlink{display:none}
section{padding:28px 0}
.hero{padding:16px 0 28px}
.hero .sub{font-size:18px;color:var(--soft);margin-top:14px;max-width:34em}
.cta{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px;max-width:420px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:6px 14px;border-radius:10px;font:600 17px/1.2 'Golos Text',system-ui,sans-serif;text-decoration:none;border:2px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;white-space:nowrap}
.btn:hover{background:#ece4d3;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fffdf8}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fffdf8}
.note{margin-top:14px;color:var(--soft);font-size:16px}
.shot{margin:26px 0 0}
.shot picture,.shot img{width:100%}
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(43,33,24,.06)}
figcaption{font-size:14.5px;color:var(--soft);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.kicker{color:var(--soft);margin-top:10px;max-width:40em}
/* install */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}
.tabs button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 16px 'Golos Text',system-ui,sans-serif;cursor:pointer;padding:0 10px}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.panel>p{margin:0 0 12px}
.panel>p+p.small,.small{font-size:16px;color:var(--soft)}
.js .panel[hidden]{display:none}
html:not(.js) .panel{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
html:not(.js) .tabs{display:none}
.well{display:flex;flex-direction:column;gap:10px;background:var(--well);color:var(--wellink);border-radius:12px;padding:14px;margin:0 0 12px}
.well code{display:block;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--wellink)}
.copy{min-height:44px;border-radius:8px;border:2px solid #f6f1e7;background:transparent;color:#f6f1e7;font:600 16px 'Golos Text',system-ui,sans-serif;padding:0 16px;cursor:pointer}
.copy:hover{background:#f6f1e7;color:var(--ink)}
.copy.done{background:#f6f1e7;color:var(--ink)}
.after{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.after li{padding-left:28px;position:relative}
.after li::before{content:'';position:absolute;left:4px;top:.7em;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px}
.links a{display:inline-flex;align-items:center;min-height:44px}
.ai{margin-top:14px;border-top:1px solid var(--line)}
.ai summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 0;font:600 17px/1.35 'Golos Text',system-ui,sans-serif;list-style:none}
.ai summary::-webkit-details-marker{display:none}
.ai summary::after{content:'+';font-size:26px;line-height:1;color:var(--accent);flex:none;width:24px;text-align:center}
.ai[open] summary::after{content:'\2212'}
.ai p{font-size:16px;color:var(--soft);margin-bottom:10px}
/* steps */
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:22px}
.step{display:flex;flex-direction:column;gap:10px}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 17px 'Golos Text',sans-serif}
.step h3{margin-top:2px}
.step p{color:var(--soft);font-size:17px}
.step .frame{align-self:flex-start}
.step .frame{width:100%;max-width:290px}
.step .frame img{width:100%}
/* facts */
.facts{display:grid;gap:0;margin:24px 0 0;padding:0}
.facts div{padding:8px 0;border-top:1px solid var(--line)}
.facts dt{font-weight:600}
.facts dd{margin:2px 0 0;color:var(--soft)}
/* compare */
.cmp{width:100%;border-collapse:collapse;margin-top:22px}
.cmp thead{display:none}
.cmp tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.cmp th[scope=row]{display:block;text-align:left;font:600 18px 'Literata',Georgia,serif;margin-bottom:6px}
.cmp td{display:block;padding:2px 0;color:var(--soft)}
.cmp td::before{content:attr(data-label) ': ';font-weight:600;color:var(--ink)}
.cmp td:first-of-type{color:var(--ink)}
.foot-note{font-size:16px;color:var(--soft);margin-top:14px}
/* limits */
.limits{margin:22px 0 0;padding:0 0 0 22px;display:grid;gap:10px}
.limits li::marker{color:var(--accent)}
/* faq */
.faq{margin-top:22px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:10px 2px;font:600 18px/1.35 'Golos Text',system-ui,sans-serif}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:26px;line-height:1;color:var(--accent);flex:none;width:24px;text-align:center}
.faq details[open] summary::after{content:'\2212'}
.faq details p{padding:0 2px 16px;color:var(--soft);max-width:44em}
.closing{text-align:left}
footer{border-top:1px solid var(--line);padding:22px 0 36px;font-size:15px;color:var(--soft)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px 0 0;margin-right:8px}
footer nav{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.fline{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px}
@media (max-width:359px){.tabs{grid-template-columns:1fr}}
@media (min-width:760px){
 body{font-size:19px}

}
@media (min-width:980px){

 .hero .sub{font-size:21px}
}
